server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: все маршруты (/upload, /registry, ...) отдаём index.html,
    # иначе при обновлении/прямом переходе nginx возвращает 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # собранные ассеты с хешами кэшируются надолго
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}