# Режим разработки: ИСХОДНИКИ МОНТИРУЮТСЯ ИЗ ПРОЕКТА, правки применяются
# автоматически — без пересборки образов:
#   - backend: uvicorn --reload  (сохранение файла -> сервер сам перезапускается)
#   - frontend: Vite dev server  (изменение кода -> мгновенно в браузере, HMR)
# Один запуск:  docker compose up -d
# Основной Ollama живёт на ПК: http://100.109.124.33:11434
services:
  backend:
    build: .
    command: uvicorn src.app:app --host 0.0.0.0 --port 8000 --reload
    environment:
      OLLAMA_BASE_URL: http://100.109.124.33:11434
      OLLAMA_MODEL: qwen2.5:7b
    ports:
      - "8000:8000"
    volumes:
      # код и модель бэкенда — с хоста, чтобы правки виделись сразу
      - ./src:/app/src
      - ./ml_module:/app/ml_module
      # данные (файлы и БД) — в постоянных томах
      - uploads_data:/app/uploads
      - db_data:/app/src/db
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      # весь исходник фронтенда — с хоста; node_modules берётся из образа
      # (анонимный том), чтобы зависимости не зависели от хост-папки
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: always

volumes:
  uploads_data:
  db_data: